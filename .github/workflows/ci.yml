name: CI Frontend Pattern Catalog
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tests de contenu, cohérence des flux et sécurité
        run: node --test tests/catalog.test.mjs
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Installer le navigateur de test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Scénarios réels desktop et mobile
        run: |
          mkdir -p artifacts
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
          node --test tests/browser.test.mjs
      - name: Conserver les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-patterns-screenshots
          path: artifacts/
          if-no-files-found: ignore
